services:
  # ── API Service ─────────────────────────────
  - type: web
    name: smart-photo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: APP_ROLE
        value: api
      - key: REDIS_URL
        fromDatabase:
          name: smart-photo-redis
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        value: dr3bhv4fp
      - key: CLOUDINARY_API_KEY
        value: "514366221817553"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /app/serviceAccountKey.json
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "4"
    healthCheckPath: /health

  # ── ML Worker ─────────────────────────────
  - type: worker
    name: smart-photo-ml-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter plus
    envVars:
      - key: APP_ROLE
        value: worker
      - key: REDIS_URL
        fromDatabase:
          name: smart-photo-redis
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        value: dr3bhv4fp
      - key: CLOUDINARY_API_KEY
        value: "514366221817553"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /app/serviceAccountKey.json
      - key: MAX_AI_THREADS
        value: "2"

databases:
  - name: smart-photo-redis
    plan: starter
    databaseName: smart_photo_cache
    ipAllowList: []